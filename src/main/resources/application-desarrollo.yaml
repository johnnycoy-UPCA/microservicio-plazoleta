spring:
  datasource:
    url: jdbc:h2:file:./datos/plazoleta;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      "[hibernate.format_sql]": true

  flyway:
    enabled: true
    locations: classpath:db/migration

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false

servicios:
  usuarios:
    url-base: ${USUARIOS_URL_BASE:http://localhost:8081}
    api-key: ${USUARIOS_API_KEY}

  trazabilidad:
    url-base: ${TRAZABILIDAD_URL_BASE:http://localhost:8084}
    api-key: ${TRAZABILIDAD_API_KEY}

  mensajeria:
    url-base: ${MENSAJERIA_URL_BASE:http://localhost:8083}
    api-key: ${MENSAJERIA_API_KEY}

seguridad:
  jwt:
    secreto: ${JWT_SECRETO}

  pin:
    secreto: ${PIN_SECRETO}
    duracion-minutos: ${PIN_DURACION_MINUTOS:30}
    maximo-intentos: ${PIN_MAXIMO_INTENTOS:5}

outbox:
  despachador:
    intervalo-ms: 10000
    demora-inicial-ms: 10000
