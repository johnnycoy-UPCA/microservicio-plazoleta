spring:
  datasource:
    url: jdbc:h2:mem:plazoleta_prueba;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  # task:
  #   scheduling:
  #     enabled: false

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      "[hibernate.format_sql]": false

  flyway:
    enabled: true
    locations: classpath:db/migration

servicios:
  usuarios:
    url-base: http://localhost:8081
    api-key: clave-interna-usuarios-prueba-2026

  trazabilidad:
    url-base: http://localhost:8084
    api-key: clave-interna-trazabilidad-prueba-2026

  mensajeria:
    url-base: http://localhost:8083
    api-key: clave-interna-mensajeria-prueba-2026

seguridad:
  jwt:
    secreto: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=

  pin:
    secreto: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
